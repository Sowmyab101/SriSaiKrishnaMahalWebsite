<!DOCTYPE html>
<html>
<head>
<title>Bookings</title>
<link rel="stylesheet" href="style.css">
</head>


<body>

<div class="admin-container">

<!-- SIDEBAR -->
<div class="sidebar">
<h2>Mini Mahal</h2>

<a href="dashboard.html">Dashboard</a>
<a href="BookingsLists.html">Bookings</a>
<a href="gallery-admin.html">Gallery</a>
<a href="admin.html" onclick="logout()">Logout</a>
</div>

<!-- CONTENT -->
<div class="main-content">

  <div class="table-card">

    <h2>
      <i class="fas fa-calendar-check"></i>
      Bookings Management
    </h2>

    <div class="search-bar">

      <input
        type="text"
        id="searchBooking"
        placeholder="Search by name, phone, date, event..."
      >

      <button
        type="button"
        class="reset-btn"
        onclick="resetSearch()">
        Reset
      </button>

    </div>

    <table id="bookingTable">

      <thead>
        <tr>
          <th>Name</th>
          <th>Phone</th>
          <th>Date</th>
          <th>Timings</th>
          <th>Event Type</th>
          <th>Email ID</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="tableBody"></tbody>

    </table>

    <button
      type="button"
      class="download-btn"
      onclick="downloadExcel()">
      <i class="fas fa-file-excel"></i>
      Download Excel
    </button>

  </div>

</div>
<script src="script.js"></script>
<script type="module" src="js/bookingList.js"></script>
<script type="module" src="js/auth.js"></script>
</body>
</html>
